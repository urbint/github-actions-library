name: 'Terraform plan PR comment'
description: >
  Upsert a sticky PR comment for one env/region plan, including destroy
  warnings. Optionally fail the job when destroys are present.

inputs:
  working_directory:
    description: 'Directory containing plan.txt / destroys.txt.'
    required: false
    default: '.'
  env:
    description: 'Logical environment name.'
    required: true
  region:
    description: 'Deploy region.'
    required: true
  destroy_count:
    description: 'Destroy count from terraform-plan output.'
    required: false
    default: ''
  fail_on_destroys:
    description: 'Fail the job when destroy_count is non-zero.'
    required: false
    default: 'true'
  max_plan_chars:
    description: 'Truncate plan body after this many characters.'
    required: false
    default: '60000'

runs:
  using: 'composite'
  steps:
    - name: Post plan comment
      uses: actions/github-script@v7
      if: always()
      env:
        TF_ENV: ${{ inputs.env }}
        TF_REGION: ${{ inputs.region }}
        DESTROY_COUNT: ${{ inputs.destroy_count }}
        WORK_DIR: ${{ inputs.working_directory }}
        MAX_PLAN_CHARS: ${{ inputs.max_plan_chars }}
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const env = process.env.TF_ENV;
          const region = process.env.TF_REGION;
          const destroyCount = process.env.DESTROY_COUNT || '';
          const workDir = process.env.WORK_DIR || '.';
          const maxChars = parseInt(process.env.MAX_PLAN_CHARS || '60000', 10);
          const planPath = path.join(workDir, 'plan.txt');
          const destroysPath = path.join(workDir, 'destroys.txt');

          let body = `### Terraform plan — \`${env}\` / \`${region}\`\n\n`;
          if (destroyCount && destroyCount !== '0') {
            const addresses = fs.existsSync(destroysPath)
              ? fs.readFileSync(destroysPath, 'utf8').trim().split('\n').filter(Boolean)
              : [];
            body += `> [!CAUTION]\n`;
            body += `> **Merge blocked:** plan would destroy **${destroyCount}** resource(s)`;
            body += ` (includes replace / recreate).\n`;
            if (addresses.length) {
              body += addresses.map(a => `> - \`${a}\``).join('\n') + '\n';
            }
            body += '\n';
          }
          if (fs.existsSync(planPath)) {
            const plan = fs.readFileSync(planPath, 'utf8');
            const actionsMarker = 'Terraform will perform the following actions:';
            const noChangesMarker = 'No changes.';
            let relevant = plan;
            const actionsIdx = plan.indexOf(actionsMarker);
            if (actionsIdx !== -1) {
              relevant = plan.slice(actionsIdx);
            } else {
              const noChangesIdx = plan.indexOf(noChangesMarker);
              if (noChangesIdx !== -1) {
                relevant = plan.slice(noChangesIdx);
              }
            }
            const truncated = relevant.length > maxChars
              ? relevant.slice(0, maxChars) + '\n\n… truncated …'
              : relevant;
            body += '```hcl\n' + truncated + '\n```\n';
          } else {
            body += '_Plan output not available._\n';
          }
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const marker = `<!-- tf-plan-${env}-${region} -->`;
          body = marker + '\n' + body;
          const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }

    - name: Fail when plan destroys resources
      if: inputs.fail_on_destroys == 'true' && inputs.destroy_count != '' && inputs.destroy_count != '0'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        echo "::error::Terraform plan would destroy resources — merge is blocked until destroys are removed from the plan."
        echo "Addresses:"
        cat destroys.txt
        exit 1
