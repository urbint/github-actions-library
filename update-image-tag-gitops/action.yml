name: "Update Image Tag"
description: "Updates the image tag in a specified kustomization.yaml file."

inputs:
  repo:
    description: "The repository to update."
    required: true
  file_path:
    description: "The path to the kustomization.yaml file to update."
    required: true
  tag_key:
    description: "The key for the new image tag in the YAML."
    required: true
  image_name:
    description: "The name of the image to update."
    required: true
  tag:
    description: "The tag value to set."
    required: true
  branch:
    description: "The branch to update."
    required: true
  token:
    description: "GitHub token for authentication."
    required: true

runs:
  using: "composite"
  steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repo }}
        token: ${{ inputs.token }}
        ref: "${{ inputs.branch }}"
        path: gitops

    # Step 1: Check if 'yq' is installed and install it if missing
    - name: Check if yq is installed
      shell: bash
      run: |
        echo "Checking if yq is installed..."
        if command -v yq > /dev/null 2>&1; then
          echo "yq is installed, version:"
          yq --version
        else
          echo "yq is not installed. Installing yq..."
          curl -LO https://github.com/mikefarah/yq/releases/download/v4.16.1/yq_linux_amd64
          chmod +x ./yq_linux_amd64
          mv ./yq_linux_amd64 /usr/local/bin/yq
          echo "yq installed, version:"
          yq --version
        fi

    # Step 2: Update the image tag in the kustomization.yaml file
    - name: Update image tag
      shell: bash
      env:
        FILE_PATH: ${{ inputs.file_path }}
        IMAGE_NAME: ${{ inputs.image_name }}
        TAG_KEY: ${{ inputs.tag_key }}
        TAG: ${{ inputs.tag }}
        BRANCH: ${{ inputs.branch }}
      run: |
        cd gitops # Navigate to the cloned directory
        git checkout "$BRANCH"

        echo "=== Before Update ==="
        cat "$FILE_PATH"

        # When pinning by immutable digest, write the .digest field and remove any
        # mutable .newTag so kustomize renders name@sha256:...; otherwise fall back
        # to the historical .newTag behavior (backward-compatible for other callers).
        if [ "$TAG_KEY" = "digest" ]; then
          yq eval '(.images[] | select(.name == strenv(IMAGE_NAME))) |= (.digest = strenv(TAG) | del(.newTag))' -i "$FILE_PATH"
        else
          yq eval '(.images[] | select(.name == strenv(IMAGE_NAME))).newTag = strenv(TAG)' -i "$FILE_PATH"
        fi

        echo "=== After Update ==="
        cat "$FILE_PATH"

        # Commit and push the changes if there were any
        if ! git diff --quiet; then
          git add "$FILE_PATH"
          git commit -m "Update $IMAGE_NAME to $TAG"
          git push origin "$BRANCH"
        else
          echo "No changes detected in the file."
        fi
